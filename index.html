 ctx.strokeStyle='#64429a';ctx.lineWidth=2.5;for(let i=-8;i<=11;i+=9){ctx.beginPath();ctx.moveTo(i,-13);ctx.lineTo(i,8);ctx.stroke()}
 ctx.fillStyle='#fff0bf';ctx.beginPath();ctx.roundRect(-13,13,27,5,2);ctx.fill();ctx.restore();
}
function drawChronoGuardian(){
 if(!player||!wlevel('chrono')||time>=stopUntil)return;
 const target=nearest(player,385),sign=target?(target.x>=player.x?1:-1):(player.dir||1);
 const x=W*.5-sign*54,y=H*.5-21,lv=wlevel('chrono'),p=time*39;
 ctx.save();ctx.translate(x,y);ctx.scale(sign,1);
 const g=ctx.createRadialGradient(0,-28,1,0,-28,120);g.addColorStop(0,'#b783ff51');g.addColorStop(.7,'#8537de32');g.addColorStop(1,'#7037ee00');ctx.fillStyle=g;ctx.fillRect(-125,-155,250,250);
 ctx.globalAlpha=.30;ctx.strokeStyle='#d9acff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,2,65+4*Math.sin(p*.18),0,TAU);ctx.stroke();
 if(GUARDIAN_IMAGE.complete&&GUARDIAN_IMAGE.naturalWidth){
   ctx.globalAlpha=.37;ctx.drawImage(GUARDIAN_IMAGE,-54-9*Math.sin(p*.18),-146,109,159);
   ctx.globalAlpha=.94;ctx.shadowColor='#9c68ff';ctx.shadowBlur=24+lv;ctx.drawImage(GUARDIAN_IMAGE,-55+Math.sin(p*.30)*3,-145,111,162);
 }else{
  ctx.globalAlpha=.9;fillCircle(0,-64,41,'#7655c7');fillCircle(0,-113,24,'#a08dec');
 }
 const punch=Math.sin(p*1.6);
 for(let j=3;j>=0;j--){const u=(j/3),yy=-80+u*24+(j%2?12:-4),xx=33+u*50;
  drawFistBurst(xx,yy,19+u*15,'#ae83ef',.30+(.20*(3-j)));
  ctx.strokeStyle=`rgba(190,134,255,${.2+(3-j)*.12})`;ctx.lineWidth=5-j*.9;ctx.beginPath();ctx.moveTo(8,-60);ctx.lineTo(xx-10,yy);ctx.stroke();
 }
 drawFistBurst(74+punch*14,-72+6*Math.sin(p),39+Math.abs(punch)*5,'#b391fb',.95);
 ctx.textAlign='center';ctx.font='1000 13px system-ui';ctx.shadowColor='#ad6aff';ctx.shadowBlur=11;ctx.fillStyle='#f5d8ff';ctx.fillText('오라오라!',0,-162);
 ctx.restore();
}
function drawLabDummy(x,y,m){
 ctx.save();ctx.translate(x,y);const flash=m.hit>0;
 ctx.fillStyle='#080c2099';ctx.beginPath();ctx.ellipse(0,26,35,10,0,0,TAU);ctx.fill();
 ctx.strokeStyle='#754632';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-23);ctx.lineTo(0,42);ctx.moveTo(-42,-4);ctx.lineTo(42,-4);ctx.stroke();
 ctx.strokeStyle='#ebca8e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-39,-7);ctx.lineTo(39,-7);ctx.stroke();
 ctx.fillStyle=flash?'#ffe8c4':'#af7c4c';ctx.strokeStyle='#f0d197';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-27,-34,54,55,9);ctx.fill();ctx.stroke();
 for(let i=-2;i<=2;i++){ctx.strokeStyle='#d6a56e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-20+i*8,-32);ctx.lineTo(-20+i*8,20);ctx.stroke()}
 ctx.fillStyle='#f2d4a0';ctx.beginPath();ctx.arc(0,-49,18,0,TAU);ctx.fill();ctx.strokeStyle='#c08853';ctx.stroke();
 ctx.strokeStyle='#392730';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-9,18,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(0,-9,11,0,TAU);ctx.stroke();
 fillCircle(0,-9,5,'#eb4a55');fillCircle(0,-9,2,'#fff2cc');
 ctx.textAlign='center';ctx.font='1000 14px system-ui';ctx.lineWidth=4;ctx.strokeStyle='#081223';ctx.fillStyle='#ffdb82';ctx.strokeText('허수아비 ∞',0,-80);ctx.fillText('허수아비 ∞',0,-80);ctx.restore();
}

function render(){ctx.clearRect(0,0,W,H);ctx.save();if(screenShake>0)ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake));const cam=player?camera():{x:0,y:0},phase=player?phaseNumber():0;drawMap(cam,phase);if(time<stopUntil){ctx.fillStyle='#a8e8ff18';ctx.fillRect(0,0,W,H);ctx.save();ctx.textAlign='center';ctx.font='1000 21px system-ui';ctx.fillStyle='#fff1bb';ctx.shadowColor='#80bfff';ctx.shadowBlur=20;ctx.fillText(`⏳ TIME STOP · ${(stopUntil-time).toFixed(1)}s`,W/2,Math.min(H-85,123));ctx.restore()}
for(let g of gems){let x=g.x-cam.x,y=g.y-cam.y;ctx.save();ctx.translate(x,y+Math.sin(time*5+g.x*.02)*2);ctx.rotate(Math.PI/4);ctx.shadowColor=g.v>25?'#ffde75':'#69e4ff';ctx.shadowBlur=11;ctx.fillStyle=g.v>25?'#ffd77d':'#69dffc';ctx.fillRect(-g.r*.8,-g.r*.8,g.r*1.6,g.r*1.6);ctx.fillStyle='#ffffffaa';ctx.fillRect(-g.r*.5,-g.r*.5,g.r*.55,g.r*.55);ctx.restore()}
 for(let s of shots)drawProjectile(s,cam);
 for(let m of monsters){let x=m.x-cam.x,y=m.y-cam.y;if(x<-120||x>W+120||y<-120||y>H+120)continue;monsterDraw(m,x,y)}
if(time<stopUntil)drawChronoGuardian();
if(player){
 for(const k of ['shield','dagger']){
  if(!wlevel(k)||hasFusion(k))continue;
  const lv=wlevel(k),ev=progress.evo[k],n=(k==='shield'?2:3)+Math.floor((lv-1)/2)+amount()+(ev?3:0),r=(k==='shield'?64:82)*radiusMult();
  const rot=time*(k==='shield'?1.8:2.6)*(1+.08*lv)*(k==='shield'?1:-1);
  for(let j=0;j<n;j++){const a=j*TAU/n+rot,x=W*.5+Math.cos(a)*r,y=H*.5+Math.sin(a)*r;drawOrbitItem(k,lv,ev,x,y,a)}
 }
 if(player.flashDash){
  const d=player.flashDash;ctx.save();ctx.translate(W/2,H/2);ctx.rotate(d.ang);
  ctx.strokeStyle='#fff7c5';ctx.shadowColor='#ffd451';ctx.shadowBlur=26;
  for(let j=0;j<4;j++){
    ctx.globalAlpha=.67-j*.11;ctx.lineWidth=5-j*.8;
    ctx.beginPath();ctx.moveTo(-12-j*12,-12+j*7);ctx.lineTo(24+j*8,-12+j*7);ctx.stroke();
  }
  ctx.restore();
 }
 if(player.inv<=0||Math.sin(time*22)>0){ctx.save();ctx.translate(W/2,H/2);
  if(PLAYER_IMAGE.complete&&PLAYER_IMAGE.naturalWidth){let h=74,w=h*PLAYER_IMAGE.naturalWidth/PLAYER_IMAGE.naturalHeight;ctx.drawImage(PLAYER_IMAGE,-w/2,-h*.72,w,h)}
  else{fillCircle(0,0,player.r,'#79e2ff');fillCircle(0,-12,10,'#ffd6b1')}ctx.restore()}
 fillCircle(W/2,H/2+11,3,'#f6fbff')
}
for(let f of fx)drawWeaponEffect(f,cam);ctx.globalAlpha=1;for(let f of damageNums){const x=f.x-cam.x,y=f.y-cam.y;ctx.save();ctx.globalAlpha=Math.min(1,2.7*f.t);ctx.textAlign='center';ctx.lineJoin='round';ctx.shadowColor=f.crit?'#f5a733':'#141629';ctx.shadowBlur=f.crit?17:4;ctx.font=f.crit?'1000 24px system-ui':'900 16px system-ui';ctx.lineWidth=f.crit?5:3;ctx.strokeStyle='#131322e9';ctx.strokeText(f.v,x,y);ctx.fillStyle=f.color;ctx.fillText(f.v,x,y);if(f.crit){ctx.font='1000 12px system-ui';ctx.strokeText('✦ CRITICAL!',x,y-24);ctx.fillStyle='#fff4a0';ctx.fillText('✦ CRITICAL!',x,y-24)}ctx.restore()}ctx.restore()}
function loop(ts){if(!last)last=ts;let dt=Math.min(.035,(ts-last)/1000);last=ts;if(state==='playing')step(dt);render();raf=requestAnimationFrame(loop)}window.addEventListener('blur',()=>{if(state==='playing')pause()});menu();raf=requestAnimationFrame(loop);
})();
</script></body></html>
